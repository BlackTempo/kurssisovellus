# Tiedostopohjainen H2 (ei in-memory), jotta kehitysdata ja Envers-historia säilyvät uudelleenkäynnistysten yli.
spring.datasource.url=jdbc:h2:file:./data/kurssidb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# H2-konsoli on pois päältä: sitä ei tarvita, ja se olisi ylimääräinen hallintakäyttöliittymä
# tietokantaan. Kanta on tavallinen tiedosto, jota voi tutkia esim. IDE:n tietokantatyökalulla.
spring.h2.console.enabled=false
spring.jpa.show-sql=false
