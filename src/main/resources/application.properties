spring.application.name=kurssisovellus
server.port=${PORT:8080}

# Oletusprofiili on dev, jotta sovellus käynnistyy ilman ulkoista tietokantaa.
# docker-compose vaihtaa profiiliksi "docker" ympäristömuuttujalla.
spring.profiles.default=dev

# ddl-auto=update riittää harjoitustyöhön: skeema seuraa entiteettejä ilman erillisiä migraatioita.
# Oikeassa tuotannossa tämä korvattaisiin Flyway/Liquibase-migraatioilla, koska update ei
# koskaan poista sarakkeita eikä osaa uudelleennimetä niitä.
spring.jpa.hibernate.ddl-auto=update
# Open-in-view pois: lazy-relaatiot on haettava tietoisesti palvelukerroksessa, jolloin
# N+1-ongelmat ja LazyInitializationExceptionit huomataan kehitysvaiheessa eikä vasta tuotannossa.
spring.jpa.open-in-view=false

# Vaadin skannaa vain oman pakkauksen, mikä nopeuttaa dev-käynnistystä huomattavasti.
vaadin.allowed-packages=com.vaadin,org.vaadin,fi.lahtinen.kurssit
vaadin.launch-browser=false

# Sovelluksen omat asetukset
app.upload-dir=${APP_UPLOAD_DIR:./data/uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${APP_MAIL_FROM:noreply@kurssisovellus.local}

# Sähköposti: Mailpit kuuntelee oletuksena porttia 1025 ilman autentikointia.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Envers (vaatimukset 31-32):
# - with_modified_flag tallentaa jokaiselle kentälle tiedon siitä, muuttuiko se, jotta historia voi
#   näyttää "muuttuneet kentät" vertaamatta revisioita keskenään.
# - store_data_at_delete säilyttää poistetun rivin arvot historiaan; muuten poistorevisiossa olisi vain id.
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
